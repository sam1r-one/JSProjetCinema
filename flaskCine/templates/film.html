<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ film.nom_film }} - Cinéma Multiplexe du Castor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="bg-black">
    <img src="/static/images/banner.png" class="img-fluid" alt="Bannière"/>
</header>
<nav class="navbar navbar-expand-sm bg-dark navbar-dark">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="/">Accueil</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">Films</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/film/1">Croquette</a></li>
                        <li><a class="dropdown-item" href="/film/3">Lee Miller</a></li>
                        <li><a class="dropdown-item" href="/film/2">Smile 2</a></li>
                    </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/seances">Séances</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div id="main" class="container mt-4 mb-4">
    <h2 class="text-danger fw-bold mb-4">{{ film.nom_film }}</h2>

    <div class="row">
        <div class="col-md-5">
            <img src="/static/images/affiche-smile.jpg" class="img-fluid rounded" alt="{{ film.nom_film }}">
        </div>

        <div class="col-md-7">
            <h4>Informations</h4>
            <div class="d-flex align-items-center gap-3 my-3">
                <span>Durée : <strong>{{ film.duree }}min</strong></span>
                {% if film.interdit_16 %}
                <img src="/static/images/interdiction-moins-de-16-ans.png" alt="-16 ans" style="height: 35px;">
                {% endif %}
            </div>

            <h4 class="mt-4">Résumé</h4>
            <p class="text-muted" style="text-align: justify; line-height: 1.6;">
                {{ film.resume }}
            </p>
        </div>
    </div>
</div>

<footer class="pied mt-auto py-3 bg-light text-center">
    BTS CIEL Simone de Beauvoir, 2026
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
